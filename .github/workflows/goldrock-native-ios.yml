name: GoldRock native iOS

on:
  pull_request:
    paths:
      - 'GoldRockNative/**'
      - '.github/workflows/goldrock-native-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build native SwiftUI app for iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild -project GoldRockNative/GoldRock.xcodeproj \
            -scheme GoldRock -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/GoldRockDerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/goldrock-build.log"
      - name: Choose available iPhone Simulator
        id: iphone
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [(runtime, device) for runtime, entries in devices.items() for device in entries if "iPhone" in device.get("name", "") and device.get("isAvailable", True)]
          iphones.sort(key=lambda pair: pair[0], reverse=True)
          print(iphones[0][1]["udid"] if iphones else "")
          ')"
          test -n "$udid" || { echo 'No available iPhone Simulator'; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run native XCTest
        run: |
          set -o pipefail
          xcodebuild -project GoldRockNative/GoldRock.xcodeproj \
            -scheme GoldRock -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.iphone.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/GoldRockDerivedData" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/goldrock-test.log"
      - name: Install and launch native app on iPhone Simulator
        run: |
          xcrun simctl boot '${{ steps.iphone.outputs.udid }}' 2>/dev/null || true
          xcrun simctl bootstatus '${{ steps.iphone.outputs.udid }}' -b
          xcrun simctl install '${{ steps.iphone.outputs.udid }}' "$RUNNER_TEMP/GoldRockDerivedData/Build/Products/Debug-iphonesimulator/GoldRock.app"
          xcrun simctl launch '${{ steps.iphone.outputs.udid }}' com.goldrockhealth.app
          xcrun simctl io '${{ steps.iphone.outputs.udid }}' screenshot "$RUNNER_TEMP/goldrock-native-simulator.png"
      - name: Preserve Xcode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldrock-native-xcode-logs
          path: |
            ${{ runner.temp }}/goldrock-build.log
            ${{ runner.temp }}/goldrock-test.log
            ${{ runner.temp }}/goldrock-native-simulator.png
          if-no-files-found: ignore
